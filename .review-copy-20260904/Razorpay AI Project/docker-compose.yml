services:
  postgres:
    image: postgres:16-alpine
    container_name: recovery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot_password
      POSTGRES_DB: recovery_autopilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d recovery_autopilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recovery_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recovery_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://autopilot:autopilot_password@postgres:5432/recovery_autopilot
      REDIS_URL: redis://redis:6379/0
      USE_IN_PROCESS_WORKER: "false"
      MODEL_PROVIDER: fake
      SYNTHETIC_MODE: "true"
      SIMULATE_NOTIFICATIONS: "true"
      RAZORPAY_KEY_ID: rzp_test_simulation_key
      RAZORPAY_KEY_SECRET: rzp_test_simulation_secret
      RAZORPAY_WEBHOOK_SECRET: rzp_whsec_simulation_key
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recovery_worker
    restart: unless-stopped
    command: ["celery", "-A", "recovery_autopilot.workers.celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://autopilot:autopilot_password@postgres:5432/recovery_autopilot
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: fake
      SYNTHETIC_MODE: "true"
      SIMULATE_NOTIFICATIONS: "true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recovery_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
