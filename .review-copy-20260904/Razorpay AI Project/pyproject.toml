[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recovery-autopilot-root"
version = "0.1.0"
description = "Autonomous, safety-bounded subscription recovery agent for Razorpay"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
